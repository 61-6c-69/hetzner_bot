version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host ${API_HOST} --port ${API_PORT} --reload
    volumes:
      - .:/app
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BOT_TOKEN=${BOT_TOKEN}
      - HETZNER_API_KEY=${HETZNER_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    depends_on:
      - db
      - redis

  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    command: python bot.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BOT_TOKEN=${BOT_TOKEN}
      - HETZNER_API_KEY=${HETZNER_API_KEY}
    depends_on:
      - db
      - redis
      - api

  monitoring_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python monitoring_worker.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - HETZNER_API_KEY=${HETZNER_API_KEY}
    depends_on:
      - db
      - redis

  billing_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python billing_worker.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - HETZNER_API_KEY=${HETZNER_API_KEY}
    depends_on:
      - db
      - redis

  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - api

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data: