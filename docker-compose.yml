version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/hetzner
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    command: python bot.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/hetzner
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hetzner
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  monitoring:
    build: 
      context: .
      dockerfile: Dockerfile
    command: python monitoring_worker.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/hetzner
      - REDIS_URL=redis://redis:6379/0
      - HETZNER_API_TOKEN=${HETZNER_API_TOKEN}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data: 